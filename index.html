<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%276%27 fill=%27%23C2185B%27/%3E%3Cpath d=%27M7.5 6h2.6l1.3 3.2-1.6 1a7 7 0 0 0 3.2 3.2l1-1.6 3.2 1.3v2.6a1.3 1.3 0 0 1-1.3 1.3A10.2 10.2 0 0 1 6.2 7.3 1.3 1.3 0 0 1 7.5 6%27 fill=%27white%27/%3E%3C/svg%3E">
<title>Pages Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@500;600&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{
  --ground:#F3F4F8; --surface:#FFFFFF; --surface-2:#EEF0F6; --ink:#181A28; --ink-2:#454A5F; --muted:#6D7289;
  --line:#E0E3EC; --line-strong:#C8CCDA;
  --accent:#C2185B; --accent-hover:#A3134C; --accent-ink:#FFFFFF; --accent-soft:#FBE6EE;
  --focus:#3B4CCA; --danger:#B42318; --warn:#9A5800; --scrim:rgba(14,16,30,.38);
  --s-new:#3445C4; --s-new-bg:#E7EAFD;
  --s-no_answer:#596074; --s-no_answer-bg:#E8EAF0;
  --s-callback:#9A5800; --s-callback-bg:#FCEFD8;
  --s-talking:#0A679A; --s-talking-bg:#DFF0FA;
  --s-portfolio:#6A2FBF; --s-portfolio-bg:#EFE6FC;
  --s-meeting_set:#00766A; --s-meeting_set-bg:#D9F3EE;
  --s-meeting_done:#2A7A33; --s-meeting_done-bg:#E1F2E2;
  --s-won:#0F7136; --s-won-bg:#CDEDD9;
  --s-lost:#9E3626; --s-lost-bg:#F7E3DF;
  --s-junk:#7F8296; --s-junk-bg:#EDEEF2;
  --r-hot:#C2410C; --r-hot-bg:#FFE6D5; --r-warm:#A15C07; --r-warm-bg:#FEF0C7;
  --r-cold:#1D5FB0; --r-cold-bg:#DFEBFB; --r-unqualified:#6B7080; --r-unqualified-bg:#ECEDF1;
  --shadow-sm:0 1px 2px rgba(20,22,40,.05),0 4px 14px rgba(20,22,40,.06);
  --shadow:0 2px 6px rgba(20,22,40,.08),0 18px 48px rgba(20,22,40,.16);
  --radius:12px;
  --f-display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#101118; --surface:#181A24; --surface-2:#20232F; --ink:#ECEDF5; --ink-2:#BCC0D2; --muted:#8B90A7;
    --line:#2A2D3B; --line-strong:#3A3E50;
    --accent:#FF5E95; --accent-hover:#FF7BA8; --accent-ink:#1A0610; --accent-soft:#3B1426;
    --focus:#8EA0FF; --danger:#FF7A6B; --warn:#F4B860; --scrim:rgba(0,0,0,.55);
    --s-new:#A3AEFF; --s-new-bg:#23284A; --s-no_answer:#A9AFC2; --s-no_answer-bg:#262938;
    --s-callback:#F4B860; --s-callback-bg:#3A2C12; --s-talking:#6CC4F0; --s-talking-bg:#13303F;
    --s-portfolio:#C39BFF; --s-portfolio-bg:#2E2147; --s-meeting_set:#4FD1BF; --s-meeting_set-bg:#10332F;
    --s-meeting_done:#7FD487; --s-meeting_done-bg:#16301A; --s-won:#5BE08C; --s-won-bg:#0F3720;
    --s-lost:#F0907E; --s-lost-bg:#3D1D17; --s-junk:#8E92A3; --s-junk-bg:#24262F;
    --r-hot:#FF8A4C; --r-hot-bg:#3F1D0C; --r-warm:#F5C451; --r-warm-bg:#3A2E0E;
    --r-cold:#7DB4FF; --r-cold-bg:#132A47; --r-unqualified:#9A9EAE; --r-unqualified-bg:#262832;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 18px 48px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#101118; --surface:#181A24; --surface-2:#20232F; --ink:#ECEDF5; --ink-2:#BCC0D2; --muted:#8B90A7;
  --line:#2A2D3B; --line-strong:#3A3E50;
  --accent:#FF5E95; --accent-hover:#FF7BA8; --accent-ink:#1A0610; --accent-soft:#3B1426;
  --focus:#8EA0FF; --danger:#FF7A6B; --warn:#F4B860; --scrim:rgba(0,0,0,.55);
  --s-new:#A3AEFF; --s-new-bg:#23284A; --s-no_answer:#A9AFC2; --s-no_answer-bg:#262938;
  --s-callback:#F4B860; --s-callback-bg:#3A2C12; --s-talking:#6CC4F0; --s-talking-bg:#13303F;
  --s-portfolio:#C39BFF; --s-portfolio-bg:#2E2147; --s-meeting_set:#4FD1BF; --s-meeting_set-bg:#10332F;
  --s-meeting_done:#7FD487; --s-meeting_done-bg:#16301A; --s-won:#5BE08C; --s-won-bg:#0F3720;
  --s-lost:#F0907E; --s-lost-bg:#3D1D17; --s-junk:#8E92A3; --s-junk-bg:#24262F;
  --r-hot:#FF8A4C; --r-hot-bg:#3F1D0C; --r-warm:#F5C451; --r-warm-bg:#3A2E0E;
  --r-cold:#7DB4FF; --r-cold-bg:#132A47; --r-unqualified:#9A9EAE; --r-unqualified-bg:#262832;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 18px 48px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
html,body{background:var(--ground)}
body{color:var(--ink);font:400 14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--accent)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding-inline:24px;padding-block:20px 96px}
@media (max-width:600px){.wrap{padding-inline:16px;padding-block:14px 96px}}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.mark{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.mark svg{width:20px;height:20px}
h1{font:700 26px/1 var(--f-display);letter-spacing:-.025em;margin:0}
.sub{margin:4px 0 0;color:var(--muted);font-size:13px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{font:600 13.5px/1 var(--f-body);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:10px 14px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;text-decoration:none;white-space:nowrap;transition:border-color .12s,background .12s}
.btn:hover{border-color:var(--ink-2)}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.small{padding:7px 10px;font-size:12.5px;border-radius:8px}
.btn.link{border-color:transparent;background:none;color:var(--muted);padding-inline:6px}
.btn.link:hover{color:var(--ink)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
@media (max-width:600px){.top-actions .btn .lbl-long{display:none}}

.banner{margin-top:14px;padding:11px 14px;border-radius:10px;background:var(--s-callback-bg);color:var(--ink);border:1px solid color-mix(in srgb,var(--s-callback) 30%,transparent);font-size:13.5px}

/* tabs */
.tabs{display:flex;gap:2px;margin-top:20px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--ground);z-index:5}
.tabs button{background:none;border:0;padding:12px 14px 11px;font:600 14.5px var(--f-body);color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab-count{font:600 11.5px var(--f-mono);color:var(--muted);margin-left:5px;padding:2px 6px;border-radius:999px;background:var(--surface-2)}
.tabs button[aria-selected="true"] .tab-count.hot{background:var(--accent);color:var(--accent-ink)}

/* today */
.pulse{display:flex;flex-wrap:wrap;align-items:center;gap:10px 26px;padding:20px 0 4px}
.pulse a{text-decoration:none;color:var(--ink-2);display:flex;align-items:baseline;gap:7px;font-size:13.5px}
.pulse a:hover span{text-decoration:underline}
.pulse b{font:600 24px/1 var(--f-mono);color:var(--ink);letter-spacing:-.02em}
.pulse a.hot b{color:var(--danger)}
.pulse .spacer{flex:1}
.section{margin-top:28px;scroll-margin-top:60px}
.section-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.section-h h2{font:650 19px/1.2 var(--f-display);letter-spacing:-.015em;margin:0}
.section-h .n{font:600 12.5px var(--f-mono);color:var(--muted)}
.section-h p{margin:0;color:var(--muted);font-size:13px;flex-basis:100%}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px 12px;display:flex;flex-direction:column;gap:7px;cursor:pointer;transition:border-color .12s,box-shadow .12s;min-width:0}
.card:hover{border-color:var(--line-strong);box-shadow:var(--shadow-sm)}
.card-top{display:flex;align-items:center;gap:8px;min-height:22px}
.grow{flex:1}
.card-name{font:600 16.5px/1.2 var(--f-display);letter-spacing:-.01em;margin:0;overflow-wrap:anywhere}
.card-co{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.card-note{margin:0;color:var(--ink-2);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;background:var(--surface-2);border-radius:8px;padding:6px 9px}
.card-foot{display:flex;align-items:center;gap:6px;margin-top:2px;flex-wrap:wrap}
.card-foot .mono{font-size:13px;color:var(--ink-2);margin-right:auto}
.more{margin-top:10px}
.empty{padding:22px;border:1px dashed var(--line-strong);border-radius:var(--radius);color:var(--muted);text-align:center;background:color-mix(in srgb,var(--surface) 50%,transparent)}
.empty strong{display:block;color:var(--ink);font:600 16px var(--f-display);margin-bottom:4px}

/* chips & pills */
.chip{--c:var(--s-junk);--cb:var(--s-junk-bg);display:inline-flex;align-items:center;gap:6px;font:600 11.5px/1 var(--f-body);padding:5px 9px 5px 8px;border-radius:999px;color:var(--c);background:var(--cb);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
[data-s="new"]{--c:var(--s-new);--cb:var(--s-new-bg)}
[data-s="no_answer"]{--c:var(--s-no_answer);--cb:var(--s-no_answer-bg)}
[data-s="callback"]{--c:var(--s-callback);--cb:var(--s-callback-bg)}
[data-s="talking"]{--c:var(--s-talking);--cb:var(--s-talking-bg)}
[data-s="portfolio"]{--c:var(--s-portfolio);--cb:var(--s-portfolio-bg)}
[data-s="meeting_set"]{--c:var(--s-meeting_set);--cb:var(--s-meeting_set-bg)}
[data-s="meeting_done"]{--c:var(--s-meeting_done);--cb:var(--s-meeting_done-bg)}
[data-s="won"]{--c:var(--s-won);--cb:var(--s-won-bg)}
[data-s="lost"]{--c:var(--s-lost);--cb:var(--s-lost-bg)}
[data-s="junk"]{--c:var(--s-junk);--cb:var(--s-junk-bg)}
.pkg{display:inline-flex;align-items:center;gap:6px;font:500 12px/1 var(--f-body);color:var(--ink-2);white-space:nowrap}
.pkg em{font-style:normal;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.bars{display:inline-flex;gap:2px;align-items:flex-end}
.bars i{width:4px;border-radius:1px;background:var(--line-strong)}
.bars i:nth-child(1){height:6px}.bars i:nth-child(2){height:8px}.bars i:nth-child(3){height:10px}.bars i:nth-child(4){height:12px}
.bars i.on{background:var(--ink-2)}
.pkg.r3 .bars i.on,.pkg.r4 .bars i.on{background:var(--accent)}
.tl{font-size:12px;color:var(--muted);white-space:nowrap}
.tl.now{color:var(--accent);font-weight:600}
.due{font:500 12px var(--f-mono);color:var(--ink-2);white-space:nowrap}
.due.overdue{color:var(--danger);font-weight:600}
.due.today{color:var(--warn);font-weight:600}
.tag{font:500 11.5px var(--f-body);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 8px;white-space:nowrap}
/* lead rating */
[data-r="hot"]{--rc:var(--r-hot);--rb:var(--r-hot-bg)}
[data-r="warm"]{--rc:var(--r-warm);--rb:var(--r-warm-bg)}
[data-r="cold"]{--rc:var(--r-cold);--rb:var(--r-cold-bg)}
[data-r="unqualified"]{--rc:var(--r-unqualified);--rb:var(--r-unqualified-bg)}
.rate{display:inline-flex;align-items:center;gap:4px;font:700 10.5px/1 var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--rc);background:var(--rb);border-radius:5px;padding:4px 6px 4px 5px;white-space:nowrap;vertical-align:middle}
.rate svg{width:12px;height:12px;flex:none}
.c-name strong .rate{margin-right:6px;position:relative;top:-1px}
.rate-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rb{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:9px 10px;cursor:pointer;color:var(--ink)}
.rb b{display:inline-flex;align-items:center;gap:5px;font:650 13.5px/1.1 var(--f-body);color:var(--rc)}
.rb b svg{width:14px;height:14px}
.rb span{font-size:11.5px;color:var(--muted);line-height:1.3}
.rb:hover{border-color:var(--rc)}
.rb[aria-pressed="true"]{background:var(--rb);border-color:var(--rc);box-shadow:inset 0 0 0 1px var(--rc)}
.rb kbd{font:500 10.5px var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:auto}
@media (max-width:480px){.rate-row{grid-template-columns:1fr 1fr}}
.pulse a.hotk b{color:var(--r-hot)}

/* all leads */
.filters{display:flex;flex-wrap:wrap;gap:8px;padding:18px 0 10px;align-items:center}
.search{flex:1 1 280px;position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none}
.search input{width:100%;padding-left:34px}
input[type=search],input[type=text],input[type=email],input[type=tel],input[type=date],input[type=time],select,textarea{background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;padding:9px 11px;font-size:14px;min-width:0}
select{padding-right:28px;cursor:pointer}
input:focus,select:focus,textarea:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 18%,transparent)}
.filters select{flex:0 1 auto}
.st-chips{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:12px}
.st-chips button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 10px;font:600 12.5px/1 var(--f-body);color:var(--ink-2);cursor:pointer}
.st-chips button:hover{border-color:var(--line-strong)}
.st-chips button .k{font:600 11.5px var(--f-mono);color:var(--muted)}
.st-chips button[data-s]::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.st-chips button[aria-pressed="true"]{background:var(--cb,var(--ink));border-color:var(--c,var(--ink));color:var(--c,var(--surface))}
.st-chips button[aria-pressed="true"] .k{color:inherit}
.st-chips button.all[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.result-line{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:13px;padding-bottom:8px;flex-wrap:wrap}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.row,.row-head{display:grid;grid-template-columns:minmax(170px,1.5fr) 152px 122px 84px 132px 128px minmax(150px,2fr) 50px;gap:12px;align-items:center;padding:11px 16px}
.row-head{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--surface-2);padding-block:9px}
.row{border-top:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--surface-2)}
.c-name{min-width:0}
.c-name strong{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-name span{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-phone{font-size:13px;color:var(--ink-2)}
.c-note{color:var(--ink-2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-mo{color:var(--muted);font-size:12px}
.c-next .none{color:var(--line-strong)}
@media (max-width:1120px){
  .row,.row-head{grid-template-columns:minmax(160px,1.6fr) 146px 118px 80px 128px 124px}
  .c-note,.c-mo{display:none}
}
@media (max-width:780px){
  .row-head{display:none}
  .row{grid-template-columns:1fr auto;grid-template-areas:"name st" "phone next" "pkg tl" "note note";gap:6px 12px;padding:12px 14px}
  .c-name{grid-area:name}.c-st{grid-area:st;justify-self:end}.c-phone{grid-area:phone}.c-next{grid-area:next;justify-self:end}
  .c-pkg{grid-area:pkg}.c-tl{grid-area:tl;justify-self:end}
  .c-note{grid-area:note;display:block;white-space:normal;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
  .c-next:empty{display:none}
}

/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:40;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dw-bar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid transparent;background:none;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn:disabled{opacity:.35;cursor:default;background:none}
.icon-btn svg{width:18px;height:18px}
.dw-nav{display:flex;align-items:center;gap:4px;margin-left:auto;font:500 12.5px var(--f-mono);color:var(--muted)}
.dw-scroll{overflow-y:auto;flex:1;overscroll-behavior:contain}
.dw-sec{padding:16px 20px;border-bottom:1px solid var(--line)}
.dw-sec:last-child{border-bottom:0}
.dw-sec h4{margin:0 0 10px;font:600 11.5px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.dw-name{font:700 25px/1.12 var(--f-display);letter-spacing:-.02em;margin:0;overflow-wrap:anywhere}
.dw-co{color:var(--ink-2);margin-top:4px;font-size:14px;overflow-wrap:anywhere}
.dw-tags{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:12px}
.contact{display:flex;flex-direction:column;gap:10px}
.c-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.c-line .val{font-size:17px;font-weight:600;margin-right:auto;user-select:all;overflow-wrap:anywhere}
.c-line .val.email{font:500 14px var(--f-body);color:var(--ink-2)}
.wa{color:#128C4A}
:root[data-theme="dark"] .wa{color:#4ADE80}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wa{color:#4ADE80}}
textarea{width:100%;resize:vertical;line-height:1.45}
.oc-group{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:start;margin-top:10px}
.oc-label{font:500 12px var(--f-body);color:var(--muted);padding-top:9px}
.oc-row{display:flex;flex-wrap:wrap;gap:6px}
.oc{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:8px 11px;font:600 13px/1.1 var(--f-body);color:var(--ink);cursor:pointer}
.oc::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.oc:hover{border-color:var(--c);background:var(--cb)}
.oc[aria-pressed="true"]{background:var(--cb);border-color:var(--c);color:var(--c)}
.oc small{font:500 11px var(--f-mono);color:var(--muted)}
.note-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;color:var(--muted);font-size:12.5px}
.follow-now{font:600 14px var(--f-body);color:var(--ink);text-transform:none;letter-spacing:0;margin-left:auto}
.follow-now.overdue{color:var(--danger)}.follow-now.today{color:var(--warn)}
.follow-row{display:flex;gap:8px;flex-wrap:wrap}
.follow-row input[type=date]{flex:1 1 150px}
.follow-row input[type=time]{flex:0 1 120px}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.quick button{border:1px dashed var(--line-strong);background:none;border-radius:999px;padding:6px 11px;font:500 12.5px var(--f-body);color:var(--ink-2);cursor:pointer}
.quick button:hover{border-style:solid;border-color:var(--ink-2);color:var(--ink)}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{position:relative;padding:0 0 14px 20px}
.timeline li::before{content:"";position:absolute;left:4px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--c,var(--line-strong))}
.timeline li::after{content:"";position:absolute;left:7px;top:18px;bottom:2px;width:1px;background:var(--line)}
.timeline li:last-child::after{display:none}
.timeline .t{font-size:13.5px;color:var(--ink)}
.timeline .t b{font-weight:600}
.timeline .t p{margin:3px 0 0;color:var(--ink-2);overflow-wrap:anywhere;white-space:pre-wrap}
.timeline .m{font-size:12px;color:var(--muted);margin-top:2px}
.details-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.details-grid label,.form label{display:flex;flex-direction:column;gap:5px;font:500 12.5px var(--f-body);color:var(--ink-2)}
.details-grid input,.details-grid select{width:100%}
@media (max-width:480px){.details-grid{grid-template-columns:1fr}.oc-group{grid-template-columns:1fr;gap:4px}.oc-label{padding-top:0}}
.meta-line{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-radius:9px;background:var(--s-lost-bg);color:var(--ink);margin-top:10px;font-size:13px}

/* modal */
.modal-wrap{position:fixed;inset:0;background:var(--scrim);z-index:50;display:grid;place-items:center;padding:16px}
.modal{width:min(680px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
.modal h2{font:700 22px/1.15 var(--f-display);letter-spacing:-.02em;margin:0 0 6px}
.modal .lead{color:var(--ink-2);margin:0 0 16px;font-size:13.5px;max-width:62ch}
.form{display:flex;flex-direction:column;gap:12px}
.form .details-grid{gap:12px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.form-msg{margin:0;font-size:13px;color:var(--danger)}
.form-msg.ok{color:var(--ink-2)}
.drop{border:1.5px dashed var(--line-strong);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.file-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.preview{margin-top:14px}
.preview-stats{display:flex;gap:8px 18px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2);margin-bottom:10px}
.preview-stats b{font-family:var(--f-mono);color:var(--ink)}
.ptable-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.ptable{border-collapse:collapse;width:100%;font-size:12.5px}
.ptable th,.ptable td{padding:7px 10px;text-align:left;border-top:1px solid var(--line);white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.ptable th{border-top:0;background:var(--surface-2);font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.check{display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:13px;color:var(--ink-2)}
.check input{margin-top:2px;accent-color:var(--accent)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:11px 14px 11px 16px;border-radius:11px;z-index:70;display:flex;align-items:center;gap:14px;font-size:13.5px;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.toast button{background:none;border:0;color:var(--accent);font:700 13.5px var(--f-body);cursor:pointer;padding:2px 4px}
:root[data-theme="dark"] .toast button{color:#C2185B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .toast button{color:#C2185B}}

.skeleton{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:10px;margin-top:24px}
.skeleton div{height:132px;border-radius:var(--radius);background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sh 1.4s infinite linear;border:1px solid var(--line)}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skeleton div{animation:none}*{transition:none!important}}
.gate{position:fixed;inset:0;z-index:80;background:var(--ground);display:grid;place-items:center;padding:24px 16px}
.gate-card{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 26px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.gate-card h2{font:700 24px/1.1 var(--f-display);letter-spacing:-.02em;margin:0 0 6px}
.gate-card p{margin:0;color:var(--ink-2);font-size:14px;line-height:1.5}
.gate-btn{margin-top:16px;width:100%;justify-content:center;padding:12px 14px;font-size:14.5px}
.gate-btn svg{width:18px;height:18px}
.linkish{background:none;border:0;padding:0;color:var(--muted);font:inherit;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.linkish:hover{color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

/* ---------- import parsing ---------- */
const EMAIL_RX = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const PHONE_RX = /^(p:\s*)?\+?\d[\d\s-]{8,}$/;
function normPkg(s) { s = (s || '').toLowerCase(); for (const k of Object.keys(PKG)) if (s.includes(k)) return k; return ''; }
function normTl(s) { s = (s || '').toLowerCase().trim(); if (s.startsWith('immediately')) return 'now'; if (s.startsWith('in_2')) return '2-3w'; if (s.startsWith('in_1_month')) return '1m'; if (s.startsWith('flexible')) return 'flexible'; return ''; }
function parseDelimited(text) {
  const firstLine = text.split(/\r?\n/, 1)[0] || '';
  const delim = firstLine.split('\t').length >= firstLine.split(',').length ? '\t' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"' && cell === '') q = true;
    else if (c === delim) { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
function isHeader(cells) { const low = cells.map(c => c.toLowerCase().trim()); return ['email', 'phone_number', 'first_name', 'full_name', 'phone', 'mobile'].some(h => low.includes(h)); }
function buildHeader(cells) {
  const low = cells.map(c => c.toLowerCase().replace(/[\s-]+/g, '_'));
  const find = (...n) => low.findIndex(c => n.includes(c));
  const h = {email: find('email', 'email_address', 'email_id'), name: find('first_name', 'full_name', 'name', 'lead_name'), phone: find('phone_number', 'phone', 'mobile', 'mobile_number', 'whatsapp'),
    company: find('company_name', 'company', 'brand', 'business'), created: find('created_time', 'date', 'lead_date', 'enquiry_date'), rating: find('rating', 'lead_rating', 'temperature'),
    pkg: low.findIndex(c => c.startsWith('how_many') || c === 'package'), tl: low.findIndex(c => c.startsWith('when_do_you') || c === 'go_live' || c === 'golive' || c === 'timeline')};
  h.meta = h.created >= 0 || h.rating >= 0 || low.includes('ad_name') || low.includes('campaign_name') || low.includes('package') || low.includes('go_live');
  h.after = Math.max(h.company, h.phone, h.email, h.name, h.pkg, h.tl, h.created, h.rating);
  h.low = low;
  return h;
}
function loosePkg(s) {
  s = (s || '').toLowerCase(); const p = normPkg(s); if (p) return p;
  if (/20\s*\+|more than 20/.test(s)) return 'scaling'; if (/10\s*[-–]\s*20/.test(s)) return 'growth';
  if (/5\s*[-–]\s*10/.test(s)) return 'advance'; if (/3\s*[-–]\s*5/.test(s)) return 'launch'; return '';
}
function looseTl(s) {
  s = (s || '').toLowerCase(); const t = normTl(s); if (t) return t;
  if (/immediate|7\s*day|now|asap|this week/.test(s)) return 'now'; if (/flex|plan/.test(s)) return 'flexible';
  if (/2\s*[-–]\s*3|week/.test(s)) return '2-3w'; if (/month/.test(s)) return '1m'; return '';
}
function parseDate(s) {
  s = (s || '').trim(); if (!s) return null;
  const m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);
  if (m) { const y = Number(m[3].length === 2 ? '20' + m[3] : m[3]); const d = new Date(y, Number(m[2]) - 1, Number(m[1]), 12); return isNaN(d) ? null : d; }
  const d = new Date(s); return isNaN(d) ? null : d;
}
function fromHeader(cells, h) {
  const g = j => j >= 0 ? (cells[j] || '').trim() : '';
  const em = g(h.email);
  const r = g(h.rating).toLowerCase();
  const notes = cells.map((c, j) => j > h.after && (j >= h.low.length || h.low[j] === '' || /follow|note|remark|comment/.test(h.low[j])) ? (c || '').trim() : '').filter(Boolean);
  return {name: g(h.name), phone: normPhone(g(h.phone)), email: EMAIL_RX.test(em) ? em : '', company: g(h.company),
    package: loosePkg(g(h.pkg)), timeline: looseTl(g(h.tl)), notes, created: parseDate(g(h.created)),
    rating: RATING.find(x => r.startsWith(x.k.slice(0, 4)))?.k || ''};
}
const TEMPLATE = 'name,phone,email,company,package,go_live,date,rating,notes\n' +
  'Priya Sharma,+91 98765 43210,priya@glowco.in,Glow Co,Launch (3-5 ads),Within 7 days,06/11/2026,Hot,Skincare brand - wants Hindi videos\n' +
  'Rahul Verma,9812345678,,Urban Threads,Growth (10-20 ads),In 1 month,05/11/2026,,Came from Instagram DM\n';
async function downloadTemplate() {
  if (!S.dl) { toast('Downloads aren’t available here — copy the column names shown instead.'); return; }
  try { await S.dl.save({filename: 'lead-import-template.csv', data: TEMPLATE}); toast('Template saved'); }
  catch (e) { if (!e || e.code !== 'declined') toast('Couldn’t save the template here.'); }
}
function fromContent(cells, emailCol) {
  const pkgI = cells.findIndex(c => c.toLowerCase().includes('package'));
  const tlI = cells.findIndex(c => normTl(c));
  const emI = cells.findIndex(c => EMAIL_RX.test(c));
  let anchor = emI >= 0 ? emI : (pkgI >= 0 || tlI >= 0) ? Math.max(pkgI, tlI) + 1 : emailCol;
  let phI = -1; for (let j = anchor + 1; j < cells.length; j++) if (PHONE_RX.test(cells[j])) { phI = j; break; }
  if (phI < 0) phI = anchor + 2;
  let phone = normPhone(cells[phI] || '');
  if (!phone && PHONE_RX.test(cells[anchor] || '')) phone = normPhone(cells[anchor]);
  return {name: cells.slice(anchor + 1, phI).filter(Boolean).join(' ').trim(), phone, email: emI >= 0 ? cells[emI] : '',
    company: cells[phI + 1] || '', package: pkgI >= 0 ? normPkg(cells[pkgI]) : '', timeline: tlI >= 0 ? normTl(cells[tlI]) : '',
    notes: cells.slice(phI + 2).filter(Boolean), created: null};
}
function parseLeads(text) {
  const out = []; let hdr = null;
  for (const raw of parseDelimited(text)) {
    const cells = raw.map(c => (c || '').trim());
    if (!cells.some(Boolean)) continue;
    if (isHeader(cells)) { hdr = buildHeader(cells); continue; }
    const r = hdr && hdr.meta ? fromHeader(cells, hdr) : fromContent(cells, hdr && hdr.email >= 0 ? hdr.email : 2);
    if (r.phone || r.email) out.push(r);
  }

}
function leadIndex() {

  return {find: r => (digits(r.phone) && byPhone.get(digits(r.phone))) || (r.email && byEmail.get(r.email.toLowerCase())) || null};
}
function makeId(r) {
  if (r.phone) return 'p' + digits(r.phone);
  if (r.email) return 'e' + r.email.toLowerCase().replace(/[^a-z0-9_\-.~:@+]/g, '').slice(0, 180);
  return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
async function ensureMonth(key) {

  }).filter(r => !r.dupIn);

  el.innerHTML = `<div class="preview-stats"><span><b>${fresh.length}</b> new</span><span><b>${old.length}</b> already in the list</span></div>
    <div class="ptable-wrap"><table class="ptable"><thead><tr><th></th><th>Name</th><th>Phone</th><th>Company</th><th>Package</th><th>Go-live</th><th>Notes</th></tr></thead><tbody>

    </tbody></table></div>${S.importRows.length > 12 ? `<p class="meta-line" style="margin:8px 0 0">…and ${S.importRows.length - 12} more</p>` : ''}`;
  go.disabled = !fresh.length && !old.length;

}
async function runImport() {
  const rows = S.importRows || []; const go = $('#i-go');
  const doDupes = $('#i-dupe').checked;
  const fresh = rows.filter(r => !r.existing), old = doDupes ? rows.filter(r => r.existing) : [];
  if (!fresh.length && !old.length) return;
  go.disabled = true;
  let done = 0, failed = 0; const total = fresh.length + old.length;
  const tick = () => { go.textContent = `Saving ${done} of ${total}…`; };
  tick();
  try {
    const keys = [...new Set(fresh.map(r => monthKeyOf(r.created || new Date())))];
    for (const k of keys) await ensureMonth(k);
  } catch (e) { onWriteError(e); go.disabled = false; go.textContent = 'Try again'; return; }
  const jobs = [
    ...fresh.map((r, i) => () => write(`months/${monthKeyOf(r.created || new Date())}/leads/${makeId(r)}`, newLeadDoc(r, i), true)),
    ...old.map(r => () => {
      const l = getLead(r.existing.path); if (!l) return Promise.resolve();
      const entry = {kind: 'status', s: l.status || 'new', t: 'Filled the form again', at: new Date().toISOString(), by: S.meId};
      if (r.notes.length) entry.note = r.notes.join(' · ');
      const patch = {enquiries: (l.enquiries || 1) + 1, notes: [...l.notes, entry]};
      if (['no_answer', 'lost'].includes(l.status)) Object.assign(patch, {status: 'new', attempts: 0, nextAt: null});
      return write(l.path, patch);
    }),
  ];
  let k = 0;
  const worker = async () => { while (k < jobs.length) { const j = jobs[k++]; try { await j(); } catch (e) { failed++; if (e && (e.code === 'read_only' || e.code === 'quota_exceeded')) { k = jobs.length; } } done++; tick(); } };
  await Promise.all([worker(), worker(), worker()]);
  closeModal();
  toast(failed ? `Saved ${total - failed} of ${total}. ${failed} didn’t save — try importing them again.` : `Imported ${fresh.length} new lead${fresh.length === 1 ? '' : 's'}${old.length ? `, updated ${old.length}` : ''}`);
  if (fresh.length) { S.view = 'today'; renderView(); }
}
async function readFile(file) {
  const buf = new Uint8Array(await file.arrayBuffer());
  if (buf[0] === 0xFF && buf[1] === 0xFE) return new TextDecoder('utf-16le').decode(buf.subarray(2));
  if (buf[0] === 0xFE && buf[1] === 0xFF) return new TextDecoder('utf-16be').decode(buf.subarray(2));
  const t = new TextDecoder('utf-8').decode(buf); return t.charCodeAt(0) === 0xFEFF ? t.slice(1) : t;
}
async function takeFile(file) {
  if (!file) return;
  if (/\.json$/i.test(file.name)) {
    try { $('#i-file-name').textContent = file.name; await restoreBackup(JSON.parse(await readFile(file))); }
    catch (e) { $('#i-preview').innerHTML = `<p class="form-msg">That backup file couldn’t be read.</p>`; }
    return;
  }
  try { const t = await readFile(file); $('#i-text').value = t; $('#i-file-name').textContent = file.name; previewImport(t); }
  catch (e) { $('#i-preview').innerHTML = `<p class="form-msg">Couldn’t read that file. Save it as CSV and try again.</p>`; }
}

async function exportCSV() {

/* ---------- backup restore ---------- */
async function restoreBackup(json) {
  if (!json || json.format !== 'leadbook-backup' || !Array.isArray(json.leads)) { toast('That file isn’t a Lead Book backup.'); return; }
  if (S.readOnly || !S.db) { toast('You need edit access to restore a backup.'); return; }
  const el = $('#i-preview');
  const existing = new Set(allLeads().map(l => l.path));
  const clash = json.leads.filter(r => existing.has(`months/${r.month}/leads/${r.id}`)).length;
  el.innerHTML = `<div class="preview-stats"><span><b>${json.leads.length}</b> leads in backup</span><span><b>${(json.months || []).length}</b> months</span>${clash ? `<span><b>${clash}</b> will overwrite leads already here</span>` : ''}</div>
    <div class="modal-actions" style="justify-content:flex-start;margin-top:4px"><button type="button" class="btn primary" id="r-go">Restore ${json.leads.length} leads</button></div>`;
  $('#r-go').onclick = async () => {
    const go = $('#r-go'); go.disabled = true;
    const writes = [...(json.months || []).map(m => [`months/${m.id}`, m.data]), ...json.leads.map(r => [`months/${r.month}/leads/${r.id}`, r.data])];
    try {
      for (let i = 0; i < writes.length; i += 400) {
        const batch = S.db.batch();
        writes.slice(i, i + 400).forEach(([p, d]) => batch.set(S.db.doc(p), d));
        go.textContent = `Restoring ${Math.min(i + 400, writes.length)} of ${writes.length}…`;
        await batch.commit();
      }
      closeModal(); toast(`Restored ${json.leads.length} leads`);
    } catch (e) { onWriteError(e); go.disabled = false; go.textContent = 'Try again'; }
  };
}

  p.setCustomParameters({prompt: 'select_account'});
  auth.signInWithPopup(p).catch(e => {
    if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment', 'auth/cancelled-popup-request'].includes(e.code)) return auth.signInWithRedirect(p);
    if (e.code === 'auth/popup-closed-by-user') return;
    gate('signin', e.code === 'auth/unauthorized-domain' ? 'This website isn’t on Firebase’s allowed domains yet (Authentication → Settings → Authorized domains).' : 'Sign-in didn’t finish: ' + (e.message || e.code));
  });
}
/* ---------- portal: shared API + router ---------- */
const PAGES = ['overview', 'leads', 'invoices', 'settings'];
const APP = window.APP = {
  S, $, $$, esc, toast, opt, ICON, pad, dkey, addDays, todayKey, WD, MO, MONTH_FULL, digits, normPhone, fmtPhone, EMAIL_RX,
  parseDelimited, readFile, openModal, closeModal, onWriteError, allLeads, getLead, displayName, rateBadge, chip, dueState,
  openLead: path => openLead(path, 'all'),
  get db() { return S.db; }, get meId() { return S.meId; }, get readOnly() { return S.readOnly; },
  user: null, pages: {}, readyHooks: [], listeners: {},
  onReady(fn) { this.readyHooks.push(fn); if (S.db && this.user) fn(S.db, this.user); },
  on(evt, fn) { (this.listeners[evt] = this.listeners[evt] || []).push(fn); },
  emit(evt, data) { (this.listeners[evt] || []).forEach(fn => { try { fn(data); } catch (e) { console.error(e); } }); },
  download(filename, data) { return S.dl.save({filename, data}); },
  go(hash) { if (location.hash === hash) route(); else location.hash = hash; },
};
let lastPage = null;
function route() {
  const raw = location.hash.replace(/^#\/?/, '');
  const top = raw.split(/[/?]/)[0];
  const page = PAGES.includes(top) ? top : (top.startsWith('sec-') ? 'leads' : 'overview');
  if (top.startsWith('sec-')) return;
  S.page = page;
  PAGES.forEach(p => { const el = $('#page-' + p); if (el) el.hidden = p !== page; });
  $$('[data-route]').forEach(a => a.setAttribute('aria-current', a.dataset.route === page ? 'page' : 'false'));
  if (page !== 'leads' && S.open) closeDrawer();
  if (!$('#modal').hidden && lastPage !== null) closeModal();
  const mod = APP.pages[page];
  if (mod) mod.render(raw.slice(top.length).replace(/^\//, ''));
  if (page === 'leads') renderView();
  if (lastPage !== page || page === 'invoices') window.scrollTo(0, 0);
  lastPage = page;
}
APP.route = route;
window.addEventListener('hashchange', route);

function boot() {
  $('#bottom-nav').innerHTML = $('#side-nav').innerHTML.replace(/id="nav-(\w+)"/g, 'data-count="$1"');
  loadPrefs();
  const t = new Date(); $('#today-label').textContent = `${WD[t.getDay()]} ${t.getDate()} ${MO[t.getMonth()]}`;
  renderFilterControls(); renderView();
  S.dl = {save: async ({filename, data}) => {
    const url = URL.createObjectURL(new Blob([data], {type: filename.endsWith('.csv') ? 'text/csv;charset=utf-8' : 'application/octet-stream'}));
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); return {status: 'saved'};
  }};
  route();
  if (!window.firebase || !CFG.firebase || !CFG.firebase.apiKey) { S.phase = 'nodb'; gate('setup'); return; }
  firebase.initializeApp(CFG.firebase);
  const db = firebase.firestore();
  db.settings({ignoreUndefinedProperties: true, merge: true});
  db.enablePersistence({synchronizeTabs: true}).catch(() => {});
  S.db = db;
  S.people = new Map();
  S.user = {profiles: async ids => Object.fromEntries([].concat(ids).map(id => [id, {id, name: (S.people.get(id) || {}).name || ''}]))};
  gate('loading');
  firebase.auth().onAuthStateChanged(u => {
    if (!u) { gate('signin'); return; }
    S.meId = u.uid; S.meName = u.displayName || u.email;
    $('#who').innerHTML = `<div class="who-name">${esc(u.displayName || 'Signed in')}</div><div class="who-mail">${esc(u.email || '')}</div><button type="button" class="linkish" data-act="signout">Sign out</button>`;
    startData(u);
  });
}
let started = false;
function startData(u) {
  if (started) return; started = true;
  S.slowTimer = setTimeout(() => { if (S.phase === 'loading') { S.slow = true; renderBanner(); } }, 10000);
  const denied = e => { if (e && e.code === 'permission-denied') { clearTimeout(S.slowTimer); gate('denied', u.email); return true; } return false; };
  S.db.collection('months').onSnapshot({includeMetadataChanges: true}, snap => {
    gate(null);
    for (const d of snap.docs) {
      const data = d.data() || {};
      S.months.set(d.id, {key: d.id, label: data.label || monthLabelOf(d.id), tab: data.tab || ''});
      if (!S.monthSubs.has(d.id)) subMonth(d.id);
    }
    if (!snap.metadata.fromCache) S.monthsReady = true;
    onData();
  }, err => { if (denied(err)) return; S.err = err && err.code || 'error'; S.monthsReady = true; S.phase = 'ready'; onData(); });
  S.db.collection('people').onSnapshot(snap => { snap.docs.forEach(d => S.people.set(d.id, d.data())); if (S.open) fillNames($('#drawer')); }, () => {});
  S.db.doc(`people/${u.uid}`).set({name: u.displayName || '', email: u.email || '', lastSeen: new Date().toISOString()}, {merge: true}).catch(() => {});
  APP.user = u;
  APP.readyHooks.forEach(fn => { try { fn(S.db, u); } catch (e) { console.error(e); } });
}
function subMonth(key) {
  const sub = {ready: false};
  S.monthSubs.set(key, sub);
  S.db.collection(`months/${key}/leads`).onSnapshot({includeMetadataChanges: true}, snap => {
    const m = new Map();
    for (const d of snap.docs) { const data = d.data(); if (data) { const l = hydrate(key, d.id, data); m.set(l.path, l); } }
    S.byMonth.set(key, m);
    if (!snap.metadata.fromCache) sub.ready = true;
    onData();
  }, err => { sub.ready = true; S.err = err && err.code || 'error'; onData(); });
}
boot();
})();
